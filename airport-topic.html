<body class="bg-white text-ink antialiased">
  <header class="sticky top-0 z-40 border-b border-line bg-white/95 backdrop-blur-sm"><div class="mx-auto flex h-16 max-w-screen-2xl items-center justify-between px-5 md:h-20 md:px-10 xl:px-16"><a href="index.html" class="flex items-baseline gap-2"><span class="text-xl font-black">梯云社</span><span class="hidden text-[10px] font-bold uppercase tracking-widest text-muted sm:inline">TIYUN CLUB</span></a><nav class="hidden items-center gap-7 text-sm font-medium xl:flex"><a href="index.html">首页</a><a class="font-bold" href="airports.html">机场推荐</a><a href="tools.html">工具使用</a><a href="knowledge.html">知识库</a><a href="index.html#about">关于</a><a href="index.html?search=1" class="p-2" aria-label="搜索"><i data-lucide="search" class="h-4 w-4"></i></a><a href="disclaimer.html" class="text-xs">免责声明</a></nav><a href="airports.html" class="text-sm font-semibold xl:hidden">品牌排行</a></div></header>

  <main>
    <header class="border-b border-line"><div class="mx-auto max-w-screen-2xl px-5 py-14 md:px-10 md:py-24 xl:px-16"><div class="flex items-center justify-between border-b border-black pb-4 font-mono text-[11px] uppercase text-muted"><span>Airport Guides / 机场推荐</span><span id="topicIndex"></span></div><div class="mt-10 grid gap-8 lg:grid-cols-12 lg:items-end"><div class="lg:col-span-8"><p id="topicEyebrow" class="text-xs font-bold text-muted"></p><h1 id="topicTitle" class="mt-5 text-4xl font-black leading-tight md:text-7xl"></h1></div><p id="topicDescription" class="max-w-lg leading-relaxed text-gray-600 lg:col-span-4"></p></div></div></header>

    <section id="emptyBrandSection" class="mx-auto hidden max-w-screen-2xl px-5 pt-14 md:px-10 md:pt-20 xl:px-16"><div class="border-y border-line py-10 md:flex md:items-center md:justify-between"><div><p class="font-mono text-xs uppercase text-muted">Current Status / 当前状态</p><h2 class="mt-3 text-2xl font-bold">现未收录</h2></div><p class="mt-4 max-w-lg text-sm leading-relaxed text-gray-600 md:mt-0">暂未收录符合当前主题且经过核验的品牌，后续新增内容会自动同步到这里。</p></div></section>
    <section id="brandSection" class="mx-auto hidden max-w-screen-2xl px-5 pt-14 md:px-10 md:pt-20 xl:px-16"><div class="mb-8 flex items-end justify-between"><div><p class="font-mono text-xs uppercase text-muted">Brand Ranking / 品牌排行</p><h2 class="mt-2 text-2xl font-bold">已收录品牌</h2></div><span class="font-mono text-xs text-muted">TOP 10 · AUTO SYNC</span></div><div id="brandGrid" class="border-t border-black"></div></section>
    <section class="mx-auto max-w-screen-2xl px-5 py-14 md:px-10 md:py-20 xl:px-16"><div class="mb-9 flex items-end justify-between"><div><p class="font-mono text-xs uppercase text-muted">Reading Matrix / 阅读矩阵</p><h2 class="mt-2 text-2xl font-bold">相关指南</h2></div><span id="articleCount" class="font-mono text-xs text-muted"></span></div><div id="articleGrid" class="grid border-l border-t border-line md:grid-cols-2 xl:grid-cols-3"></div><div class="mt-12 flex flex-wrap gap-3 border-t border-black pt-7"><a href="airports.html" class="border border-black bg-black px-5 py-3 text-sm font-semibold text-white transition-colors hover:bg-white hover:text-black">查看品牌总榜</a><a href="knowledge.html?tag=%E6%9C%BA%E5%9C%BA%E6%8E%A8%E8%8D%90" class="border border-black px-5 py-3 text-sm font-semibold hover:bg-black hover:text-white">更多机场文章</a></div></section>
  </main>

  <footer class="border-t border-line bg-paper"><div class="mx-auto flex max-w-screen-2xl justify-between gap-4 px-5 py-10 text-xs text-muted md:px-10 xl:px-16"><span>© 2026 TIYUN CLUB</span><a href="disclaimer.html">免责声明</a></div></footer>

  <script src="assets/posts-data.js?v=4"></script>
  <script>
    const topics = {
      stable: { index:'01 / 07', eyebrow:'稳定优先', title:'稳定抗封锁专线榜', description:'聚合关注晚高峰可用率、低抖动、故障恢复与长期稳定性的选购和诊断内容。', terms:['稳定','断连','专线','企业','晚高峰'] },
      value: { index:'02 / 07', eyebrow:'预算与体验', title:'平价高性价比机场榜', description:'从月付门槛、流量倍率、晚高峰表现和退款条款出发，筛选真正适合长期使用的平价方案。', terms:['平价','性价比','低价','月付','一元'] },
      premium: { index:'03 / 07', eyebrow:'线路品质', title:'IEPL / IPLC 顶级专线榜', description:'集中阅读 IPLC、IEPL、BGP 中转和企业线路相关内容，理解低延迟与稳定性的真实来源。', terms:['IPLC','IEPL','专线','BGP','企业'] },
      budget: { index:'04 / 07', eyebrow:'10 元内方案', title:'10元内平价月付合集', description:'面向轻量浏览、临时使用与预算敏感用户，比较低门槛月付、体验套餐和实际使用限制。', terms:['10 元','月付','平价','一元','预算'] },
      payg: { index:'05 / 07', eyebrow:'灵活计费', title:'按量计费与不限时套餐', description:'适合低频查资料和备用需求，重点核对流量有效期、倍率、设备数量以及长期闲置成本。', terms:['按量','不限时','流量','备用','轻度'] },
      discounts: { index:'06 / 07', eyebrow:'价格追踪', title:'2026 最新独家优惠码', description:'整理折扣选择方法、续费原价和活动期限核对要点。优惠信息以品牌实时页面为准。', terms:['优惠','折扣','省钱','价格','年付'] },
      trials: { index:'07 / 07', eyebrow:'先测后买', title:'免费试用与一元体验', description:'用最低成本验证本地线路、客户端兼容性和晚高峰表现，避免未经测试直接购买长期套餐。', terms:['试用','一元','体验','月付','测试'] }
    };
    const key = new URLSearchParams(location.search).get('topic') || 'stable';
    const topic = topics[key] || topics.stable;
    const posts = window.TIYUN_POSTS || [];
    const scored = posts.map(post => ({ post, score: topic.terms.reduce((score, term) => score + (`${post.title} ${post.description} ${(post.tags || []).join(' ')}`.toLowerCase().includes(term.toLowerCase()) ? 1 : 0), 0) })).filter(item => item.score > 0).sort((a,b) => b.score-a.score).slice(0,9).map(item => item.post);
    document.title = `${topic.title}｜梯云社`;
    document.querySelector('meta[name="description"]').content = topic.description;
    document.getElementById('topicIndex').textContent = topic.index;
    document.getElementById('topicEyebrow').textContent = topic.eyebrow;
    document.getElementById('topicTitle').textContent = topic.title;
    document.getElementById('topicDescription').textContent = topic.description;
    document.getElementById('articleCount').textContent = `${String(scored.length).padStart(2,'0')} ARTICLES`;
    document.getElementById('articleGrid').innerHTML = scored.map(post => `<article class="group flex min-h-72 flex-col justify-between border-b border-r border-line p-7 hover:bg-gray-50"><div><div class="flex justify-between text-xs text-muted"><span class="border border-gray-300 px-2.5 py-1 font-mono text-ink">${post.category}</span><time>${post.date.replaceAll('-','.')}</time></div><h3 class="mt-7 text-xl font-bold leading-snug"><a href="${post.url}">${post.title}</a></h3><p class="mt-4 line-clamp-2 text-sm leading-relaxed text-gray-600">${post.description}</p></div><a href="${post.url}" class="mt-8 flex justify-between text-xs text-muted"><span>${post.readingMinutes} MIN READ</span><i data-lucide="arrow-right" class="h-4 w-4 transition-transform group-hover:translate-x-1"></i></a></article>`).join('');

    const brandTopics = ['stable','value','premium','budget','payg'];
    const fallbackBrands = [
      { name:'云界线', summary:'综合推荐 · ¥8/月起', url:'https://9625mofan01.yunjiexianaff.com/#/?code=OOYhSj0L' },
      { name:'大佬云', summary:'专线品质 · ¥8/月起', url:'https://mofanvip01.dalaoyunaff.com/#/?code=QT2rqp5V' },
      { name:'环球梯', summary:'全球覆盖 · ¥8/月起', url:'https://mofanvip01.huanqiutiaff.com/#/?code=l7oLmjVU' },
      { name:'神行加速', summary:'低延迟 · ¥8/月起', url:'https://vipmofan01.shenxingaff.com/#/?code=nn4ohwnK' },
      { name:'榴莲云', summary:'平价月付 · ¥8/月起', url:'https://mofan88.liulianyunaff.com/#/?code=ETsQBSuR' },
      { name:'闪电鼠', summary:'均衡方案 · ¥8/月起', url:'https://mofanvip01.shandianshuaff.com/#/?code=a3GAQAXg' },
      { name:'极连云', summary:'连接效率 · 多设备' },
      { name:'可信云', summary:'透明信息 · 稳健选择' },
      { name:'快狸', summary:'轻量套餐 · 灵活付费' },
      { name:'EdgeNova', summary:'技术向 · 边缘网络' }
    ];
    const seededShuffle = (items, seed) => {
      let state = [...seed].reduce((hash, char) => ((hash * 31) + char.charCodeAt(0)) >>> 0, 2166136261);
      const result = [...items];
      for (let index = result.length - 1; index > 0; index--) {
        state = (state * 9301 + 49297) % 233280;
        const target = Math.floor((state / 233280) * (index + 1));
        [result[index], result[target]] = [result[target], result[index]];
      }
      return result;
    };

    function displayBrands(brands) {
      const pinned = ['云界线','大佬云'].map(name => brands.find(brand => brand.name === name)).filter(Boolean);
      const remaining = brands.filter(brand => !['云界线','大佬云'].includes(brand.name));
      const ordered = [...pinned, ...seededShuffle(remaining, key)];
      document.getElementById('brandGrid').innerHTML = ordered.map((brand, index) => {
        const href = brand.url || `airports.html?brand=${encodeURIComponent(brand.name)}`;
        const external = Boolean(brand.url);
        return `<a href="${href}" ${external ? 'target="_blank" rel="sponsored noopener noreferrer"' : ''} class="group grid min-h-24 grid-cols-[3rem_minmax(0,1fr)_auto] items-center gap-4 border-b border-line px-1 py-5 transition-colors hover:bg-gray-50 md:grid-cols-[5rem_minmax(0,1fr)_minmax(12rem,22rem)_auto] md:gap-7 md:px-5"><span class="font-mono text-xs text-muted">${String(index + 1).padStart(2,'0')}</span><strong class="text-lg md:text-xl">${brand.name}</strong><small class="hidden text-sm text-muted md:block">${brand.summary}</small><i data-lucide="arrow-up-right" class="h-4 w-4 transition-transform group-hover:-translate-y-0.5 group-hover:translate-x-0.5"></i></a>`;
      }).join('');
      document.getElementById('brandSection').classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }

    async function updateBrands() {
      try {
        const response = await fetch('airports.html');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const source = await response.text();
        const copy = new DOMParser().parseFromString(source, 'text/html');
        const links = Object.fromEntries([...source.matchAll(/'([^']+)':\s*'(https:\/\/[^']+)'/g)].map(match => [match[1], match[2]]));
        const brands = [...copy.querySelectorAll('main article')].map(row => ({
          name: row.querySelector('h3')?.textContent.trim(),
          summary: row.querySelector('h3 + p')?.textContent.trim() || '查看品牌信息',
          url: links[row.querySelector('h3')?.textContent.trim()]
        })).filter(brand => brand.name);
        if (brands.length) displayBrands(brands);
      } catch (error) {
        console.warn('Brand matrix could not be loaded:', error);
      }
    }
    if (brandTopics.includes(key)) {
      displayBrands(fallbackBrands);
      updateBrands();
    }
    if (key === 'trials') document.getElementById('emptyBrandSection').classList.remove('hidden');
    document.addEventListener('DOMContentLoaded',()=>window.lucide&&lucide.createIcons(),{once:true});
  </script>
  <script src="assets/airport-menu.js" defer></script>
</body>
</html>
