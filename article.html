  <script src="assets/posts-data.js?v=4"></script>
  <script>
    const allowedPosts = new Set((window.TIYUN_POSTS || []).map((post) => post.slug));

    function parsePost(source) {
      const match = source.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);
      if (!match) return { meta: {}, body: source };
      const meta = {};
      match[1].split('\n').forEach(line => {
        const separator = line.indexOf(':');
        if (separator < 0) return;
        const key = line.slice(0, separator).trim();
        meta[key] = line.slice(separator + 1).trim().replace(/^['"]|['"]$/g, '');
      });
      return { meta, body: match[2] };
    }

    async function loadArticle() {
      const slug = new URLSearchParams(location.search).get('post');
      if (!allowedPosts.has(slug)) return showError();
      try {
        const bundledPost = (window.TIYUN_POSTS || []).find((post) => post.slug === slug);
        let meta;
        let body;

        if (bundledPost?.body) {
          meta = bundledPost;
          body = bundledPost.body;
        } else {
          const response = await fetch(`posts/${slug}.md`);
          if (!response.ok) throw new Error('Not found');
          ({ meta, body } = parsePost(await response.text()));
        }
        const wordCount = body.replace(/[#*|>`\-\[\]()]/g, '').length;
        document.getElementById('title').textContent = meta.title || '未命名文章';
        document.getElementById('description').textContent = meta.description || '';
        document.getElementById('category').textContent = meta.category || '文章';
        if (meta.category === '工具使用') {
          const sectionLink = document.getElementById('sectionLink');
          const mobileSectionLink = document.getElementById('mobileSectionLink');
          const backLink = document.getElementById('backLink');
          sectionLink.href = 'tools.html';
          sectionLink.textContent = '工具使用';
          mobileSectionLink.href = 'tools.html';
          mobileSectionLink.textContent = '工具使用';
          backLink.href = 'tools.html';
          backLink.textContent = '← 返回工具使用';
        }
        document.getElementById('date').textContent = (meta.date || '').replaceAll('-', '.');
        document.getElementById('readingTime').textContent = `${Math.max(5, Math.ceil(wordCount / 350))} MIN READ`;
        const content = document.getElementById('content');
        content.innerHTML = DOMPurify.sanitize(marked.parse(body));
        content.querySelectorAll('a[href^="http://"], a[href^="https://"]').forEach((link) => {
          link.target = '_blank';
          link.rel = 'noopener noreferrer sponsored';
        });
        document.title = `${meta.title}｜梯云社`;
        document.querySelector('meta[name="description"]').setAttribute('content', meta.description || '梯云社深度技术文章');
        const canonical = `https://tiyunclub.com/article.html?post=${encodeURIComponent(slug)}`;
        document.getElementById('canonicalUrl').href = canonical;
        document.getElementById('ogTitle').content = meta.title || '梯云社深度技术文章';
        document.getElementById('ogDescription').content = meta.description || '梯云社深度技术文章';
        document.getElementById('ogUrl').content = canonical;
        document.getElementById('twitterTitle').content = meta.title || '梯云社深度技术文章';
        document.getElementById('twitterDescription').content = meta.description || '梯云社深度技术文章';
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('article').classList.remove('hidden');
        if (window.lucide) lucide.createIcons();
      } catch (error) { showError(); }
    }

    function showError() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
    }

    document.addEventListener('DOMContentLoaded', loadArticle);
  </script>
  <script src="assets/airport-menu.js" defer></script>
